  <line x1="16" y1="17" x2="16" y2="22" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="17" x2="21" y2="22" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Keychain at bottom -->
  <circle cx="16" cy="26" r="3" fill="#ffd700" opacity="0.9"/>
